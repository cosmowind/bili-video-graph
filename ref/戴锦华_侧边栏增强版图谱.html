        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 95vh;
                 background-color: #1a1a1a;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             
             #loadingBar {
                 position:absolute;
                 top:0px;
                 left:0px;
                 width: 100%;
                 height: 95vh;
                 background-color:rgba(200,200,200,0.8);
                 -webkit-transition: all 0.5s ease;
                 -moz-transition: all 0.5s ease;
                 -ms-transition: all 0.5s ease;
                 -o-transition: all 0.5s ease;
                 transition: all 0.5s ease;
                 opacity:1;
             }

             #bar {
                 position:absolute;
                 top:0px;
                 left:0px;
                 width:20px;
                 height:20px;
                 margin:auto auto auto auto;
                 border-radius:11px;
                 border:2px solid rgba(30,30,30,0.05);
                 background: rgb(0, 173, 246); /* Old browsers */
                 box-shadow: 2px 0px 4px rgba(0,0,0,0.4);
             }

             #border {
                 position:absolute;
                 top:10px;
                 left:10px;
                 width:500px;
                 height:23px;
                 margin:auto auto auto auto;
                 box-shadow: 0px 0px 4px rgba(0,0,0,0.2);
                 border-radius:10px;
             }

             #text {
                 position:absolute;
                 top:8px;
                 left:530px;
                 width:30px;
                 height:50px;
                 margin:auto auto auto auto;
                 font-size:22px;
                 color: #000000;

function djhOpenVideo() {

function djhShowRank(type, btn) {
    document.querySelectorAll('.djh-tab').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    var list = djhRData[type];
    var html = '';
    for (var i = 0; i < list.length; i++) {
        var item = list[i];
        html += '<div class="djh-rank-item" onclick="djhFocus(\'' + item.bvid + '\')">';
        html += '<span>' + (i+1) + '. ' + item.title + '</span>';
        html += '<span>' + item.val + '</span>';
        html += '</div>';
    }
    document.getElementById('djh-ranks').innerHTML = html;
}

function djhFocus(bvid) {
    if (window.network) {
        network.selectNodes([bvid]);
        network.focus(bvid, { animation: { duration: 800, easingFunction: 'easeInOutQuad' }, scale: 1.2 });
    }
    djhUpdateSidebar(bvid);
}

function djhUpdateSidebar(bvid) {
    var d = djhVData[bvid];
    if (!d) return;
    djhCurrentBV = bvid;
    
    document.getElementById('djh-title').innerText = d.title;
    
    // Show B站 video cover image
    var coverImg = document.getElementById('djh-cover');
    coverImg.src = 'https://api.bilibili.com/x/web-interface/view?bvid=' + bvid;
    // Use standard bilibili cover pattern
    coverImg.onerror = function() { this.style.display='none'; document.getElementById('djh-ph').style.display='flex'; };
    coverImg.style.display = 'block';
    document.getElementById('djh-ph').style.display = 'none';
    
    document.getElementById('djh-meta').style.display = 'block';

    document.getElementById('djh-desc').innerText = d.desc;
    document.getElementById('djh-link').href = 'https://www.bilibili.com/video/' + bvid;
}
